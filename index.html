<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Skincare">
<title>My Skincare Routine</title>
<link id="touch-icon" rel="apple-touch-icon" href="">
<script>
(function(){
  try{
    var c=document.createElement('canvas');
    c.width=180;c.height=180;
    var x=c.getContext('2d');
    x.fillStyle='#4a9b6f';
    if(x.roundRect){x.roundRect(0,0,180,180,36);x.fill();}
    else{x.fillRect(0,0,180,180);}
    x.font='110px serif';
    x.textAlign='center';
    x.textBaseline='middle';
    x.fillText('\uD83C\uDF38',90,95);
    document.getElementById('touch-icon').href=c.toDataURL('image/png');
  }catch(e){}
})();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f7f5f2;min-height:100vh}
.outer{max-width:680px;margin:0 auto;padding:1.25rem 1rem 3rem}
h1{font-size:20px;font-weight:600;color:#1a1a1a}
.subtitle{font-size:13px;color:#777;margin-top:4px;line-height:1.5}
.header{margin-bottom:1.25rem}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1.1rem}
.legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:#666}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.day-tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:1rem}
.day-tab{padding:6px 11px;font-size:13px;border:1px solid #ddd;border-radius:20px;cursor:pointer;color:#666;background:#fff;transition:all .15s;-webkit-tap-highlight-color:transparent}
.day-tab.active{background:#2d6a4f;color:#fff;border-color:#2d6a4f;font-weight:500}
.ampm-tabs{display:flex;gap:8px;margin-bottom:1.1rem}
.ampm-tab{padding:7px 22px;font-size:13px;border:1px solid #ddd;border-radius:20px;cursor:pointer;color:#666;background:#fff;-webkit-tap-highlight-color:transparent}
.ampm-tab.active{background:#2d6a4f;color:#fff;border-color:#2d6a4f;font-weight:500}
.routine-list{display:flex;flex-direction:column;gap:7px;margin-bottom:1.25rem}
.step{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;background:#fff;border:1px solid #e8e4e0;border-radius:14px}
.step-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;margin-top:1px}
.step-body{flex:1;min-width:0}
.step-name{font-size:14px;font-weight:600;color:#1a1a1a;line-height:1.3}
.step-product{font-size:11.5px;color:#888;margin-top:2px}
.step-tip{font-size:11px;color:#aaa;margin-top:4px;line-height:1.5;font-style:italic}
.badge{display:inline-block;font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:99px;margin-left:7px;vertical-align:middle;text-transform:uppercase;letter-spacing:.3px}
.badge-active{background:#fff3cd;color:#856404}
.badge-gentle{background:#d1e7dd;color:#0a5132}
.badge-eye{background:#cfe2ff;color:#084298}
.mask-note{padding:12px 14px;background:#f0f8f4;border:1px solid #b7dfc9;border-radius:14px;font-size:12.5px;color:#444;line-height:1.6}
.mask-note strong{color:#2d6a4f;font-weight:600}
</style>
</head>
<body>
<div class="outer">
<div class="header">
  <h1>🌸 My skincare routine</h1>
  <p class="subtitle">Tap a day and AM/PM to see your full routine in order.</p>
</div>

<div class="legend">
  <div class="legend-item"><div class="dot" style="background:#7F77DD"></div>Cleanse</div>
  <div class="legend-item"><div class="dot" style="background:#1D9E75"></div>Prep/tone</div>
  <div class="legend-item"><div class="dot" style="background:#BA7517"></div>Active</div>
  <div class="legend-item"><div class="dot" style="background:#378ADD"></div>Hydrate</div>
  <div class="legend-item"><div class="dot" style="background:#D4537E"></div>Seal</div>
  <div class="legend-item"><div class="dot" style="background:#639922"></div>Protect</div>
</div>

<div class="day-tabs">
  <div class="day-tab active" onclick="setDay(0)">Mon</div>
  <div class="day-tab" onclick="setDay(1)">Tue</div>
  <div class="day-tab" onclick="setDay(2)">Wed</div>
  <div class="day-tab" onclick="setDay(3)">Thu</div>
  <div class="day-tab" onclick="setDay(4)">Fri</div>
  <div class="day-tab" onclick="setDay(5)">Sat</div>
  <div class="day-tab" onclick="setDay(6)">Sun</div>
</div>

<div class="ampm-tabs">
  <div class="ampm-tab active" onclick="setAMPM('am')">☀️ Morning</div>
  <div class="ampm-tab" onclick="setAMPM('pm')">🌙 Night</div>
</div>

<div class="routine-list" id="routine-list"></div>
<div id="mask-area"></div>
</div>

var C={cleanse:'#7F77DD',prep:'#1D9E75',active:'#BA7517',hydrate:'#378ADD',seal:'#D4537E',protect:'#639922'};
var CT={cleanse:'#3C3489',prep:'#085041',active:'#633806',hydrate:'#0C447C',seal:'#72243E',protect:'#27500A'};
var currentDay=0,currentAMPM='am';

function setDay(d){
  currentDay=d;
  document.querySelectorAll('.day-tab').forEach(function(t,i){t.classList.toggle('active',i===d)});
  render();
}
function setAMPM(v){
  currentAMPM=v;
  document.querySelectorAll('.ampm-tab').forEach(function(t,i){t.classList.toggle('active',(i===0&&v==='am')||(i===1&&v==='pm'))});
  render();
}
function render(){
  var routine=ROUTINES[currentDay][currentAMPM];
  var mask=ROUTINES[currentDay].mask;
  var list=document.getElementById('routine-list');
  var maskArea=document.getElementById('mask-area');
  list.innerHTML=routine.map(function(step,i){
    var prod=PRODUCTS[step.p];
    var tipText=step.tip||prod.tip;
    var col=C[step.type];
    var colT=CT[step.type];
    var badge=step.badge?'<span class="badge badge-'+step.badge+'">'+step.badgeText+'</span>':'';
    return '<div class="step"><div class="step-num" style="background:'+col+'22;color:'+colT+'">'+(i+1)+'</div><div class="step-body"><div class="step-name">'+step.label+badge+'</div><div class="step-product">'+prod.name+'</div><div class="step-tip">'+tipText+'</div></div></div>';
  }).join('');
  maskArea.innerHTML=mask?'<div class="mask-note">'+mask.text+'</div>':'';
}
render();

</html>
